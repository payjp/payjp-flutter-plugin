name: build-test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.8
  FLUTTER_CHANNEL: stable
  CACHE_NUMBER: 0 # increment to truncate cache
  IOS_SIMULATOR_DEVICE: iPhone 17 Pro
  IOS_SIMULATOR_RUNTIME: iOS-26-0
  USER_JAVA_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # setup flutter
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.USER_JAVA_VERSION }}
          distribution: "zulu"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
      # configure cache
      - name: Cache Flutter
        uses: actions/cache@v6
        with:
          path: |
            /Users/runner/hostedtoolcache/flutter
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.CACHE_NUMBER }}-${{ hashFiles('**/*/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.CACHE_NUMBER }}-
      # check
      - run: make dependencies
      - run: make check

  build-android:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # setup flutter
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.USER_JAVA_VERSION }}
          distribution: "zulu"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Cache Flutter
        uses: actions/cache@v6
        with:
          path: |
            /Users/runner/hostedtoolcache/flutter
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.CACHE_NUMBER }}-${{ hashFiles('**/*/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.CACHE_NUMBER }}-
      # prepare flutter
      - run: make dependencies
      # build app
      - name: Build android app
        run: make build-android-example
      - name: Update Android cmdline-tools
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "cmdline-tools;latest"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run e2e test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel
          script: make driver-test

  build-ios:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # setup flutter
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.USER_JAVA_VERSION }}
          distribution: "zulu"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
      - name: Cache Flutter
        uses: actions/cache@v6
        with:
          path: |
            /Users/runner/hostedtoolcache/flutter
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.CACHE_NUMBER }}-${{ hashFiles('**/*/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ env.CACHE_NUMBER }}-
      # prepare flutter
      - run: make dependencies
      # build app
      - name: Build ios app
        run: make build-ios-example
      # connected check
      - name: List all iPhone Simulator
        run: xcrun simctl list devices available
      - name: Start iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '.devices."com.apple.CoreSimulator.SimRuntime.${{ env.IOS_SIMULATOR_RUNTIME }}"[] | select(.name == "${{ env.IOS_SIMULATOR_DEVICE }}").udid')
          xcrun simctl boot "${UDID}"
      - name: Run e2e test
        run: make driver-test

  validate-openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tool/generator

    strategy:
      matrix:
        node-version: [24.x, 26.x]

    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
    - name: Cache Node.js modules
      uses: actions/cache@v6
      with:
        path: ~/.cache/yarn
        key: ${{ runner.OS }}-node-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.OS }}-node-
          ${{ runner.OS }}-
    - name: Install dependencies
      run: yarn --frozen-lockfile
    - name: yarn validate
      run: yarn validate
      env:
        CI: true
