name: payjp_flutter_example
description: Demonstrates how to use the payjp_flutter plugin.
publish_to: 'none'

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  payjp_flutter:
    path: ../
  http: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
